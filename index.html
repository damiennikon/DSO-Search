<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSO Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --bg-color: #000000; /* Pure OLED black */
            --panel-bg: #121212; /* Very dark grey for elevated elements */
            --text-main: #e0e0e0; /* Soft white for readability without glare */
            --text-dim: #777777;
            --accent: #d32f2f; /* A deeper, more professional astronomy red */
            --accent-glow: rgba(211, 47, 47, 0.2);
            --border-color: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        /* Header & Sticky Nav */
        .app-header { background-color: var(--panel-bg); padding: 16px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Search Bar (Modern, borderless, pill-shaped) */
        .search-container { display: flex; position: relative; margin-bottom: 15px; }
        #dsoSearchInput { width: 100%; padding: 14px 40px 14px 20px; background-color: #1e1e1e; border: 1px solid transparent; color: var(--text-main); border-radius: 25px; font-size: 16px; transition: border 0.2s; }
        #dsoSearchInput:focus { outline: none; border: 1px solid var(--accent); background-color: #161616; }
        #clearSearchBtn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); font-size: 22px; display: none; padding: 5px; cursor: pointer; }

        /* Moon Toggle */
        .moon-toggle-container { margin: 0 0 16px 8px; color: #e6b800; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .moon-toggle-container input { transform: scale(1.4); accent-color: #e6b800; }

        /* Category Filters */
        .category-filters { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .category-filters::-webkit-scrollbar { display: none; }
        .cat-btn { background-color: #1e1e1e; color: var(--text-dim); border: 1px solid transparent; padding: 10px 18px; border-radius: 20px; white-space: nowrap; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .cat-btn.active { background-color: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); font-weight: bold; }

        /* Action Buttons (Polar Align) */
        .action-row { display: flex; padding: 16px; }
        .action-btn { flex: 1; padding: 14px; background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: background 0.2s; }
        .action-btn:active { background-color: #1e1e1e; }

        /* DSO List & Cards */
        #dsoList { padding: 0 16px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
        .dso-item { display: flex; align-items: center; background-color: var(--panel-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; text-align: left; color: var(--text-main); transition: transform 0.1s; }
        .dso-item:active { transform: scale(0.98); }
        .dso-item.dimmed { opacity: 0.35; filter: grayscale(50%); }

        .dso-icon { width: 44px; height: 44px; margin-right: 16px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 8px; padding: 6px; }
        .dso-text-group { flex: 1; }
        .dso-id { font-weight: bold; font-size: 1.15rem; letter-spacing: 0.5px; }
        .dso-name { font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }
        .dso-status { font-size: 0.75rem; margin-top: 6px; font-weight: bold; letter-spacing: 0.5px; }

        .status-up { color: #4caf50; }
        .status-down { color: var(--accent); }
        .status-warn { color: #ff9800; }
        .dso-arrow { font-size: 1.5rem; color: var(--border-color); font-weight: 300; }

        #showMoreBtn { width: calc(100% - 32px); margin: 0 16px 30px 16px; padding: 16px; background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-dim); border-radius: 12px; font-weight: bold; display: none; }

        /* Modals & Camera UI */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; padding: 24px; backdrop-filter: blur(4px); }
        .modal-content { background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; margin: 24px 0; font-size: 0.95rem; background: #000; padding: 16px; border-radius: 12px; }
        .modal-desc { text-align: left; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; }
        .modal-btn { width: 100%; padding: 16px; margin-top: 12px; border-radius: 12px; font-weight: bold; border: none; font-size: 1rem; }
        .btn-primary { background-color: var(--accent); color: #fff; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--text-dim); color: var(--text-main); }
        .btn-primary:disabled { background-color: #1e1e1e; color: var(--text-dim); }

        /* AR Camera UI */
        #cameraUI { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 300; }
        #cameraFeed { width: 100%; height: 100%; object-fit: cover; }
        .hud-top { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        #backButton { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 20px; font-weight: bold; backdrop-filter: blur(4px); }
        #activeTargetName { color: var(--accent); font-weight: bold; font-size: 1.2rem; text-shadow: 0 2px 4px #000; }
        .crosshair-center { position: absolute; top: 50%; left: 50%; width: 2px; height: 40px; background: rgba(211, 47, 47, 0.6); transform: translate(-50%, -50%); pointer-events: none; }
        .crosshair-center::after { content: ''; position: absolute; top: 50%; left: 50%; width: 40px; height: 2px; background: rgba(211, 47, 47, 0.6); transform: translate(-50%, -50%); }
        #yellowDot { position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; border-radius: 50%; display: none; transform: translate(-50%, -50%); transition: background-color 0.2s, box-shadow 0.2s; }
        #directionArrow { position: absolute; top: 50%; left: 50%; font-size: 40px; display: none; margin-top: -20px; margin-left: -20px; line-height: 40px; text-align: center; width: 40px; height: 40px; }
        .compass-widget { position: absolute; bottom: 30px; right: 20px; width: 60px; height: 60px; border: 2px solid var(--accent); border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        #compassNeedle { position: absolute; top: 5%; left: 45%; width: 10%; height: 90%; background: linear-gradient(to bottom, var(--accent) 50%, transparent 50%); transform-origin: center; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="search-container">
            <input type="text" id="dsoSearchInput" placeholder="Search targets (e.g. M 42, Orion)...">
            <button id="clearSearchBtn">×</button>
        </div>
        
        <label class="moon-toggle-container">
            <input type="checkbox" id="moonFilterToggle">
            🌕 Full Moon Mode (Hide faint targets)
        </label>

        <div class="category-filters">
            <button class="cat-btn active" data-cat="All">All</button>
            <button class="cat-btn" data-cat="Galaxy">Galaxies</button>
            <button class="cat-btn" data-cat="Nebula">Nebulae</button>
            <button class="cat-btn" data-cat="Cluster">Clusters</button>
        </div>
    </header>

    <div class="action-row">
        <button id="polarAlignBtn" class="action-btn">🔭 Polar Align</button>
    </div>

    <main id="dsoList"></main>
    <button id="showMoreBtn">Show More</button>

    <div id="polarModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Mount Alignment</h2>
            <button id="btnSCP" class="modal-btn btn-primary">Locate SCP (South)</button>
            <button id="btnNCP" class="modal-btn btn-primary" style="margin-top: 15px;">Locate NCP (Reverse/North)</button>
            <button id="closePolarModalBtn" class="modal-btn btn-secondary" style="margin-top: 20px;">Cancel</button>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalIcon" style="width: 60px; height: 60px; margin: 0 auto;"></div>
            <h2 id="modalTitle" style="margin-top: 10px;"></h2>
            <div id="modalId" style="color: var(--text-dim); font-weight: bold;"></div>
            <div class="modal-info-grid">
                <div><strong>Type:</strong> <span id="modalType"></span></div>
                <div><strong>Season:</strong> <span id="modalSeason"></span></div>
                <div><strong>Distance:</strong> <span id="modalDist"></span></div>
                <div id="modalAlt" style="grid-column: span 2; text-align: center; font-weight: bold; margin-top: 10px;"></div>
            </div>
            <div id="modalDesc" class="modal-desc"></div>
            <button id="locateBtn" class="modal-btn btn-primary">Locate in Sky</button>
            <button id="closeModalBtn" class="modal-btn btn-secondary">Close</button>
        </div>
    </div>

    <div id="cameraUI">
        <video id="cameraFeed" autoplay playsinline></video>
        <div class="hud-top">
            <button id="backButton">❮ Back</button>
            <div id="activeTargetName">Target</div>
            <div style="width: 60px;"></div>
        </div>
        <div class="crosshair-center"></div>
        <div id="directionArrow">➔</div>
        <div id="yellowDot"></div>
        <div class="compass-widget">
            <div id="compassNeedle"></div>
        </div>
    </div>

    <script src="./database.js"></script>
    <script src="./app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
