<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSO Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>

    <header class="app-header">
        <div class="search-container">
            <input type="text" id="dsoSearchInput" placeholder="SEARCH CATALOG...">
            <button id="clearSearchBtn">×</button>
        </div>
        
        <label class="moon-toggle-container">
            <input type="checkbox" id="moonFilterToggle">
            Moon Filter Active
        </label>

        <div class="category-filters">
            <button class="cat-btn active" data-cat="All">All</button>
            <button class="cat-btn" data-cat="Galaxy">Galaxies</button>
            <button class="cat-btn" data-cat="Nebula">Nebulae</button>
            <button class="cat-btn" data-cat="Cluster">Clusters</button>
        </div>
    </header>

    <div class="action-row">
        <button id="polarAlignBtn" class="action-btn">🔭 Polar Align</button>
    </div>

    <main id="dsoList"></main>
    <button id="showMoreBtn">Show More</button>

    <div id="polarModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 10px; color: #ff0000; text-transform: uppercase; letter-spacing: 1px;">Mount Alignment</h2>
            
            <div style="margin-bottom: 20px; background: var(--surface-dark); padding: 15px; border-radius: 6px; border: 1px solid var(--red-border); text-align: left;">
                <label style="color: var(--red-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px;">Magnetic Declination (°)</label>
                <input type="number" id="magDecInput" step="0.1" style="width: 100%; padding: 10px; background: #000; border: 1px solid var(--red-border); color: var(--red-bright); font-size: 1.1rem; border-radius: 6px; font-weight: bold; font-family: monospace;">
                <p id="magDecSuggestion" style="font-size: 0.85rem; color: var(--warn-amber); margin-top: 12px; line-height: 1.4;">Set to your local offset. This saves automatically for offline field use.</p>
            </div>

            <button id="btnSCP" class="modal-btn btn-primary">Locate SCP (South)</button>
            <button id="btnNCP" class="modal-btn btn-primary" style="margin-top: 15px;">Locate NCP (North)</button>
            <button id="closePolarModalBtn" class="modal-btn btn-secondary" style="margin-top: 20px;">Cancel</button>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalIcon" style="width: 60px; height: 60px; margin: 0 auto;"></div>
            <h2 id="modalTitle" style="margin-top: 10px; color: #ff0000;"></h2>
            <div id="modalId" style="color: #881111; font-weight: bold; letter-spacing: 1px;"></div>
            <div class="modal-info-grid">
                <div><strong>Type</strong> <span id="modalType"></span></div>
                <div><strong>Season</strong> <span id="modalSeason"></span></div>
                <div><strong>Distance</strong> <span id="modalDist"></span></div>
                <div id="modalAlt" style="grid-column: span 2; text-align: center; font-weight: bold; margin-top: 10px; font-size: 1.1rem;"></div>
            </div>
            <div id="modalDesc" class="modal-desc"></div>
            <button id="locateBtn" class="modal-btn btn-primary">Locate in Sky</button>
            <button id="closeModalBtn" class="modal-btn btn-secondary">Close</button>
        </div>
    </div>

    <div id="cameraUI">
        <video id="cameraFeed" autoplay playsinline></video>
        <div class="hud-top">
            <button id="backButton">❮ Back</button>
            <div id="activeTargetName">Target</div>
            <div style="width: 60px;"></div>
        </div>
        <div class="crosshair-center"></div>
        <div id="directionArrow">➔</div>
        <div id="yellowDot"></div>
        <div class="compass-widget">
            <div id="compassNeedle"></div>
        </div>
    </div>

    <script src="./database.js"></script>
    <script src="./app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
